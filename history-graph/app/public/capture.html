<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>自動スクショ撮影ページ（サーバ内部用）</title>
<link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.min.css">
<style>
  html,body{margin:0;height:100%;background:#1a1d20;overflow:hidden}
  #viewerEl{position:absolute;inset:0}
  #capMarkers{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:6}
  #capLeaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
  .leader-line{stroke:#41586c;stroke-width:1.2;fill:none;opacity:.85}
  .leader-dot{stroke:#fff;stroke-width:1.2}
  .diff-label{position:absolute;left:0;top:0;background:#fff;border:1px solid #b9c9d6;border-left:4px solid #999;border-radius:6px;padding:2px 8px;font-size:11.5px;line-height:1.5;color:#1c2733;white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 4px rgba(20,40,60,.25)}
  .diff-label .dl-kind{font-weight:900;margin-right:5px}
  .diff-label.k-added{border-left-color:#1e9e57}.diff-label.k-added .dl-kind{color:#1e9e57}
  .diff-label.k-removed{border-left-color:#d43a2f}.diff-label.k-removed .dl-kind{color:#d43a2f}
  .diff-label.k-changed,.diff-label.k-modified{border-left-color:#b8860b}.diff-label.k-changed .dl-kind,.diff-label.k-modified .dl-kind{color:#b8860b}
  #capStatus{position:absolute;left:8px;bottom:8px;z-index:9;color:#dfe7ee;background:rgba(20,26,32,.75);border-radius:6px;padding:4px 10px;font:12px/1.5 sans-serif}
</style>
</head>
<body>
<div id="viewerEl"></div>
<svg id="capLeaders"></svg>
<div id="capMarkers"></div>
<div id="capStatus">撮影準備中…</div>
<script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.min.js"></script>
<script src="/capture.js"></script>
</body>
</html>
