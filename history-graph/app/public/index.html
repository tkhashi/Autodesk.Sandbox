<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>履歴グラフ — Issues の生涯（実アプリ v1）</title>
<link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.min.css">
<style>
:root{
  --bg:#eceff1; --surface:#ffffff; --surface2:#f2f4f5; --ink:#232a2e; --muted:#68737a; --line:#d7dde1;
  --blue:#0696d7; --blue-dark:#0578ad; --blue-soft:#e1f2fa;
  --add:#1e9e57; --add-bg:#d9f2e3; --del:#d43a2f; --del-bg:#fde3e1; --chg:#b8860b; --chg-bg:#fff3bf;
  --red:#b91c1c; --red-bg:#fee2e2; --gold:#b45309; --gold-bg:#ffedd5;
  /* sample-d（Issues 3D デモ）の Issue 表トーン */
  --sd-head:#3c4a57; --sd-headline:#d9e2ea; --sd-rowline:#e7edf2; --sd-hover:#f5f9fc; --sd-sel:#e8f2fa;
  --sd-chip-border:#b9c9d6; --sd-chip-bg:#f2f7fb; --sd-primary:#2b7bbb; --sd-accent:#0696d7;
  --sd-pill-border:#c3d2de; --sd-pill-bg:#f2f6f9; --sd-pill-ink:#41586c; --sd-sub:#68798a; --sd-faint:#8a9aa8;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14181b; --surface:#1d2327; --surface2:#262d32; --ink:#edf1f3; --muted:#9aa6ad; --line:#333d43;
    --blue-soft:#0d2f42;
    --sd-head:#b9c7d1; --sd-headline:#3d4a54; --sd-rowline:#333d43; --sd-hover:#232d34; --sd-sel:#0d2f42;
    --sd-chip-border:#3d4a54; --sd-chip-bg:#262d32; --sd-pill-border:#3d4a54; --sd-pill-bg:#262d32; --sd-pill-ink:#c7d3dd; --sd-sub:#9aa6ad; }
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
button{font:inherit;cursor:pointer;text-align:left}
h1,h2,h3,p,ul{margin:0}
ul{padding:0}

/* ---------- レイアウト ---------- */
.shell{max-width:1320px;margin:0 auto;padding:16px 16px 36px}
.page-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:12px}
.page-head h1{font-size:19px;font-weight:900}
.page-head p{font-size:12.5px;color:var(--muted)}
.page-head .spacer{flex:1}
.btn{border:1px solid var(--sd-chip-border);background:var(--sd-chip-bg);border-radius:6px;padding:5px 12px;font-size:12.5px;color:var(--ink)}
.btn:hover{border-color:var(--sd-primary)}
.btn:disabled{opacity:.5;cursor:default}
.app-grid{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:14px;align-items:start}
@media(max-width:960px){.app-grid{grid-template-columns:1fr}}
.left-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:14px;font-weight:900}
.panel-head .ph-note{font-size:11.5px;color:var(--muted)}

/* ---------- フィルタチップ ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{border:1px solid var(--sd-chip-border);background:var(--sd-chip-bg);border-radius:6px;padding:5px 12px;font-size:12.5px;color:var(--ink)}
.chip:hover{border-color:var(--sd-primary)}
.chip.active{background:var(--sd-primary);border-color:var(--sd-primary);color:#fff;font-weight:700}
.chip .n{font-variant-numeric:tabular-nums;opacity:.85}

/* ---------- Issue 表 ---------- */
.panel.issues-panel{border:none;border-radius:10px;box-shadow:0 1px 3px rgba(20,40,60,.08)}
.issues-panel .panel-head{border-bottom:none;padding:12px 16px 2px}
.issues-panel .panel-head h2{font-size:15px;font-weight:700}
.tbl-toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 16px 6px}
.tbl-toolbar input[type="text"]{flex:1 1 110px;min-width:90px;padding:5px 8px;border:1px solid var(--sd-chip-border);border-radius:6px;font-size:12.5px;background:var(--surface);color:var(--ink)}
.pager{display:flex;align-items:center;gap:10px;padding:2px 16px 12px;font-size:12.5px;color:var(--sd-pill-ink)}
.pager button{padding:5px 12px;border:1px solid var(--sd-chip-border);background:var(--sd-chip-bg);border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--ink)}
.pager button:disabled{opacity:.45;cursor:default}
.pager select{padding:5px 6px;border:1px solid var(--sd-chip-border);border-radius:6px;font-size:12.5px;background:var(--surface);color:var(--ink)}
.tbl-wrap{overflow-x:auto}
table.issues{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
table.issues th{background:var(--surface);color:var(--sd-head);text-align:left;padding:7px 10px;font-weight:600;white-space:nowrap;border-bottom:2px solid var(--sd-headline)}
table.issues th.sortable{cursor:pointer;user-select:none}
table.issues th.sortable:hover{background:var(--sd-hover)}
table.issues th.sorted{color:var(--sd-accent)}
table.issues th .arr{font-size:10px;color:var(--sd-accent)}
table.issues td{padding:8px 10px;border-top:1px solid var(--sd-rowline);vertical-align:middle}
table.issues tbody tr{cursor:pointer}
table.issues tbody tr:hover{background:var(--sd-hover)}
table.issues tbody tr.active{background:var(--sd-sel)}
table.issues .c-num{font-variant-numeric:tabular-nums;white-space:nowrap}
.c-title{font-weight:600;line-height:1.45;min-width:180px}
table.issues .c-assignee{white-space:nowrap}
table.issues .c-due{font-variant-numeric:tabular-nums;white-space:nowrap}
table.issues .c-due.overdue{color:var(--red);font-weight:700}
.fst{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.fst i{width:4px;height:16px;border-radius:2px;display:inline-block;flex:none}
.tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:9px;background:var(--sd-pill-bg);color:var(--sd-pill-ink);border:1px solid var(--sd-pill-border);line-height:1.7;white-space:nowrap}
.badges{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.badge{font-size:11px;padding:0 7px;border-radius:9px;background:var(--sd-pill-bg);border:1px solid var(--sd-pill-border);color:var(--sd-pill-ink);white-space:nowrap;line-height:1.7}
.badge.reopen{color:#a02c2c;border-color:#e3b7b7;background:#fdf1f1}

/* ミニ履歴グラフ */
.mini-track{display:flex;align-items:center;min-width:120px}
.mini-node{display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mini-node .dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:900;border:2px solid var(--sd-pill-border);background:var(--surface);color:var(--sd-sub)}
.mini-node.start .dot{background:var(--ink);color:var(--surface);border-color:var(--ink);font-size:7px}
.mini-node.goal .dot{border-radius:6px;font-size:11px;border-color:#4caf7d;color:#4caf7d}
.mini-node.reopen .dot{background:#fdf1f1;border-color:#a02c2c;color:#a02c2c;font-size:11px}
.mini-node.model .dot{font-variant-numeric:tabular-nums;background:var(--sd-pill-bg);color:var(--sd-pill-ink);border-color:var(--sd-pill-border)}
.mini-node.now .dot{border-color:var(--sd-accent);background:var(--surface);position:relative}
.mini-node.now .dot:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--sd-accent);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){ .mini-node.now .dot:after{animation:none} }
.mini-line{flex:1;height:2px;background:var(--sd-accent);min-width:8px;margin:0 2px;opacity:.45}
.mini-line.open-end{background:repeating-linear-gradient(90deg,var(--sd-accent) 0 4px,transparent 4px 8px)}

/* ---------- Viewer ---------- */
#viewerWrap{height:380px;background:#1a1d20;border-radius:0 0 8px 8px;position:relative}
#viewerEl{position:absolute;inset:0}
#diffMarkers{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:6}
#diffLeaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.leader-line{stroke:#41586c;stroke-width:1.2;fill:none;opacity:.85}
.leader-dot{stroke:#fff;stroke-width:1.2}
.diff-label{position:absolute;left:0;top:0;background:#fff;border:1px solid #b9c9d6;border-left:4px solid #999;border-radius:6px;padding:2px 8px;font-size:11.5px;line-height:1.5;color:#1c2733;white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis;cursor:pointer;pointer-events:auto;box-shadow:0 1px 4px rgba(20,40,60,.25)}
.diff-label .dl-kind{font-weight:900;margin-right:5px}
.diff-label.k-added{border-left-color:var(--add)} .diff-label.k-added .dl-kind{color:var(--add)}
.diff-label.k-removed{border-left-color:var(--del)} .diff-label.k-removed .dl-kind{color:var(--del)}
.diff-label.k-changed{border-left-color:var(--chg)} .diff-label.k-changed .dl-kind{color:var(--chg)}
.ba-bar input[type=range]{width:130px;accent-color:var(--sd-primary);cursor:pointer}
.ba-bar input[type=range]:disabled{opacity:.45;cursor:not-allowed}
.viewer-note{padding:10px 14px;font-size:12px;color:var(--muted)}
.ba-bar{display:flex;align-items:center;gap:10px;padding:10px 14px 0;flex-wrap:wrap}
.ba-label{font-size:12px;color:var(--muted);font-weight:700}
.ba-seg{display:inline-flex}
.ba-btn{border:1px solid var(--sd-chip-border);background:var(--sd-chip-bg);padding:5px 12px;font-size:12px;color:var(--ink);cursor:pointer}
.ba-btn:first-child{border-radius:6px 0 0 6px}
.ba-btn:last-child{border-radius:0 6px 6px 0}
.ba-btn + .ba-btn{border-left:0}
.ba-btn.active{background:var(--sd-primary);border-color:var(--sd-primary);color:#fff;font-weight:700}
.ba-btn:disabled{opacity:.45;cursor:not-allowed}
.ba-btn.active:disabled{opacity:1}
.ba-note{font-size:12px;color:var(--muted)}
/* ---------- 右カラム：タイムライン ---------- */
.tl-panel{position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column}
@media(max-width:960px){.tl-panel{position:static;max-height:none}}
.tl-head{padding:13px 16px 11px;border-bottom:1px solid var(--line)}
.tl-head .kicker{font-size:11px;font-weight:900;color:var(--blue-dark);letter-spacing:.06em}
.tl-head h2{font-size:16px;line-height:1.45;margin-top:3px}
.tl-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
/* ---------- ピン時点スナップショット（デモスライス） ---------- */
#pinSnapWrap{padding:10px 16px 2px}
.pinsnap{border:1px solid var(--line);border-radius:8px;background:var(--surface2);padding:10px 12px;font-size:12.5px}
.pinsnap h3{font-size:13px;margin:0 0 2px}
.pinsnap .demo-note{font-size:11px;color:var(--muted);background:#fff8e1;border:1px dashed #d9b23a;border-radius:6px;padding:5px 8px;margin:6px 0;line-height:1.5}
.pinsnap ul{margin:4px 0 0;padding-left:18px}
.pinsnap .muted{color:var(--muted)}
.pinsnap .sim-btn{margin-top:6px;font:inherit;font-weight:700;font-size:12.5px;background:var(--blue);color:#fff;border:none;border-radius:6px;padding:7px 12px;cursor:pointer}
.pinsnap .sim-btn:disabled{opacity:.55;cursor:wait}
.vchip{display:inline-block;font-size:11.5px;font-weight:900;border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.vchip.removed{background:#e3f2e6;color:#1e7a34;border:1px solid #9ed3ab}
.vchip.changed{background:var(--chg-bg);color:var(--chg);border:1px solid #e3cf8a}
.vchip.unchanged{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.vchip.unknown{background:var(--surface);color:var(--muted);border:1px dashed var(--line)}
.tl-scroll{overflow-y:auto;padding:6px 16px 16px}
.timeline{position:relative;margin:10px 0 0 6px;padding-left:26px}
.timeline:before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:2px;background:var(--line)}
.ev{position:relative;padding:7px 0}
.ev-dot{position:absolute;left:-26px;top:11px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--muted);z-index:1}
.ev.open .ev-dot{background:var(--ink);border-color:var(--ink)}
.ev.goal .ev-dot{width:18px;height:18px;left:-28px;top:9px;border-radius:5px;background:var(--gold-bg);border-color:var(--gold)}
.ev.reopen .ev-dot{background:var(--red-bg);border-color:var(--red)}
.ev.model .ev-dot{background:var(--blue);border-color:var(--blue)}
.ev.status .ev-dot{border-radius:4px;background:var(--chg-bg);border-color:var(--chg)}
.ev.comment .ev-dot{border-color:var(--sd-primary)}
.ev.now .ev-dot{border-color:var(--blue)}
.ev.now .ev-dot:after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--blue);animation:blink 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){ .ev.now .ev-dot:after{animation:none} }
.ev-row{width:100%;background:none;border:none;padding:2px 4px;border-radius:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;font-size:13px;line-height:1.55;color:var(--ink)}
button.ev-row:hover{background:var(--surface2)}
.ev.model.selected .ev-row{background:var(--blue-soft)}
.ev-when{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.ev-text{flex:1;min-width:170px}
.ev-text b{font-weight:700}
.ev.model .ev-text{font-weight:700}
.ev .st-arrow{font-weight:900}
.ev-body{font-size:12.5px;color:var(--muted);white-space:pre-wrap;margin-top:2px}
.err{background:var(--red-bg);color:var(--red);border-radius:6px;padding:10px 14px;font-size:13px;margin-bottom:12px;display:none}

@media(max-width:720px){
  table.issues{min-width:0}
  .c-title{min-width:0}
  .c-due-cell{display:none}
}
</style>
</head>
<body>

<div class="shell">
  <div class="page-head">
    <h1>Issues — 履歴グラフ</h1>
    <p id="headNote">実データ接続中…</p>
    <span class="spacer"></span>
    <button class="btn" id="btnRefresh" type="button">履歴を取り込む（スナップショット）</button>
  </div>
  <div class="err" id="errBox"></div>

  <div class="app-grid">
    <div class="left-col">
      <section class="panel issues-panel" aria-label="Issue一覧">
        <div class="panel-head">
          <h2>Issue 一覧</h2>
          <span class="ph-note" id="tblCount"></span>
          <div class="chips" id="chips" role="group" aria-label="ステータスで絞り込み"></div>
        </div>
        <div class="tbl-toolbar">
          <input type="text" id="fltQ" placeholder="Title, ID, or description" aria-label="タイトル、ID、担当などで検索">
        </div>
        <div class="tbl-wrap">
          <table class="issues">
            <thead id="issueHead"></thead>
            <tbody id="issueRows"></tbody>
          </table>
        </div>
        <div class="pager">
          <button id="btnPrev" type="button">前へ</button>
          <span id="pagerInfo">—</span>
          <button id="btnNext" type="button">次へ</button>
          <span style="flex:1"></span>
          <label>表示件数
            <select id="pageSize">
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>
        </div>
      </section>

      <section class="panel" aria-label="3Dビューア">
        <div class="panel-head">
          <h2>3D ビューア（差分）</h2>
          <span class="ph-note" id="viewerNote"></span>
        </div>
        <div id="viewerWrap"><div id="viewerEl"></div><svg id="diffLeaders"></svg><div id="diffMarkers"></div></div>
        <div class="ba-bar">
          <span class="ba-label">Before／After 表示:</span>
          <div class="ba-seg" role="group" aria-label="Before After 表示切替">
            <button type="button" class="ba-btn active" data-bamode="overlay" disabled>重ねて表示</button>
            <button type="button" class="ba-btn" data-bamode="before" disabled>Before のみ</button>
            <button type="button" class="ba-btn" data-bamode="after" disabled>After のみ</button>
          </div>
          <span class="ba-label">表示範囲:</span>
          <div class="ba-seg" role="group" aria-label="表示範囲切替">
            <button type="button" class="ba-btn active" data-scope="focus" disabled>差分フォーカス</button>
            <button type="button" class="ba-btn" data-scope="full" disabled>全体表示</button>
          </div>
          <span class="ba-label">手前を消す範囲:</span>
          <input type="range" id="occRange" min="0" max="100" step="5" value="50" disabled aria-label="対象の手前を消す範囲">
          <span class="ba-note" id="occVal">50%</span>
        </div>
      </section>
    </div>

    <aside class="panel tl-panel" aria-label="タイムライン">
      <div class="tl-head">
        <p class="kicker">タイムライン</p>
        <h2 id="tlTitle">—</h2>
        <div class="tl-meta" id="tlMeta"></div>
      </div>
      <div id="pinSnapWrap" hidden></div>
      <div class="tl-scroll"><div class="timeline" id="tlBody"></div></div>
    </aside>
  </div>
</div>

<script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.min.js"></script>
<script src="app.js"></script>
</body>
</html>
