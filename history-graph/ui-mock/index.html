<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>履歴グラフ UIモック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff1; --surface:#ffffff; --surface2:#f2f4f5; --ink:#232a2e; --muted:#68737a; --line:#d7dde1;
  --blue:#0696d7; --blue-dark:#0578ad; --blue-soft:#e1f2fa;
  --st-open-bg:#e1f2fa; --st-open:#0578ad;
  --st-pend-bg:#ffedd5; --st-pend:#b45309;
  --st-rev-bg:#ede9fe; --st-rev:#6d28d9;
  --st-closed-bg:#e6f0e8; --st-closed:#4a6b52;
  --add:#1e9e57; --add-bg:#d9f2e3; --del:#d43a2f; --del-bg:#fde3e1; --chg:#b8860b; --chg-bg:#fff3bf;
  --red:#b91c1c; --red-bg:#fee2e2; --gold:#b45309; --gold-bg:#ffedd5;
  /* sample-d（Issues 3D デモ）の Issue 表トーン */
  --sd-head:#3c4a57; --sd-headline:#d9e2ea; --sd-rowline:#e7edf2; --sd-hover:#f5f9fc; --sd-sel:#e8f2fa;
  --sd-chip-border:#b9c9d6; --sd-chip-bg:#f2f7fb; --sd-primary:#2b7bbb; --sd-accent:#0696d7;
  --sd-pill-border:#c3d2de; --sd-pill-bg:#f2f6f9; --sd-pill-ink:#41586c; --sd-sub:#68798a; --sd-faint:#8a9aa8;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14181b; --surface:#1d2327; --surface2:#262d32; --ink:#edf1f3; --muted:#9aa6ad; --line:#333d43;
    --blue-soft:#0d2f42;
    --st-open-bg:#0d2f42; --st-open:#7cc7ec;
    --st-pend-bg:#3a2408; --st-pend:#f5b86b;
    --st-rev-bg:#2a1e4d; --st-rev:#c4b0f5;
    --st-closed-bg:#22301f; --st-closed:#a3c9ab;
    --red-bg:#3a1515; --gold-bg:#3a2408;
    --sd-head:#b9c7d1; --sd-headline:#3d4a54; --sd-rowline:#333d43; --sd-hover:#232d34; --sd-sel:#0d2f42;
    --sd-chip-border:#3d4a54; --sd-chip-bg:#262d32; --sd-pill-border:#3d4a54; --sd-pill-bg:#262d32; --sd-pill-ink:#c7d3dd; --sd-sub:#9aa6ad; --sd-faint:#8a9aa8; }
  .badge.reopen{background:#3a1515;color:#f0a3a3;border-color:#5a2b2b}
  .mini-node.reopen .dot{background:#3a1515;color:#f0a3a3;border-color:#a02c2c}
  .mini-node.status .dot,.mini-node.pending .dot{background:#3a2408}
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
button{font:inherit;cursor:pointer;text-align:left}
h1,h2,h3,p,ul{margin:0}
ul{padding:0}

/* ---------- レイアウト ---------- */
.shell{max-width:1320px;margin:0 auto;padding:16px 16px 36px}
.page-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:12px}
.page-head h1{font-size:19px;font-weight:900}
.page-head p{font-size:12.5px;color:var(--muted)}
.app-grid{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:14px;align-items:start}
@media(max-width:960px){.app-grid{grid-template-columns:1fr}}
.left-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:14px;font-weight:900}
.panel-head .ph-note{font-size:11.5px;color:var(--muted)}

/* ---------- フィルタチップ（sample-d のツールバーボタン風） ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{border:1px solid var(--sd-chip-border);background:var(--sd-chip-bg);border-radius:6px;padding:5px 12px;font-size:12.5px;color:var(--ink)}
.chip:hover{border-color:var(--sd-primary)}
.chip.active{background:var(--sd-primary);border-color:var(--sd-primary);color:#fff;font-weight:700}
.chip .n{font-variant-numeric:tabular-nums;opacity:.85}

/* ---------- Issue 表パネル／ツールバー／ページャ（sample-d 風） ---------- */
.panel.issues-panel{border:none;border-radius:10px;box-shadow:0 1px 3px rgba(20,40,60,.08)}
.issues-panel .panel-head{border-bottom:none;padding:12px 16px 2px}
.issues-panel .panel-head h2{font-size:15px;font-weight:700}
.tbl-toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 16px 6px}
.tbl-toolbar input[type="text"]{flex:1 1 110px;min-width:90px;padding:5px 8px;border:1px solid var(--sd-chip-border);border-radius:6px;font-size:12.5px;background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px}
.pager{display:flex;align-items:center;gap:10px;padding:2px 16px 12px;font-size:12.5px;color:var(--sd-pill-ink)}
.pager button{padding:5px 12px;border:1px solid var(--sd-chip-border);background:var(--sd-chip-bg);border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--ink)}
.pager button:disabled{opacity:.45;cursor:default}
.pager select{padding:5px 6px;border:1px solid var(--sd-chip-border);border-radius:6px;font-size:12.5px;background:var(--surface);color:var(--ink)}

/* ---------- Issue 表（sample-d の Forma 風テーブルに準拠） ---------- */
.tbl-wrap{overflow-x:auto}
table.issues{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
table.issues th{background:var(--surface);color:var(--sd-head);text-align:left;padding:7px 10px;font-weight:600;white-space:nowrap;border-bottom:2px solid var(--sd-headline)}
table.issues th.sortable{cursor:pointer;user-select:none}
table.issues th.sortable:hover{background:var(--sd-hover)}
table.issues th.sorted{color:var(--sd-accent)}
table.issues th .arr{font-size:10px;color:var(--sd-accent)}
table.issues td{padding:8px 10px;border-top:1px solid var(--sd-rowline);vertical-align:middle}
table.issues tbody tr{cursor:pointer}
table.issues tbody tr:hover{background:var(--sd-hover)}
table.issues tbody tr.active{background:var(--sd-sel)}
table.issues .c-num{font-variant-numeric:tabular-nums;white-space:nowrap}
.c-title{font-weight:600;line-height:1.45;min-width:180px}
table.issues .c-assignee{white-space:nowrap}
table.issues .c-due{font-variant-numeric:tabular-nums;white-space:nowrap}
table.issues .c-due.overdue{color:var(--red);font-weight:700}
table.issues .c-due .od{display:block;font-size:10px}
.fst{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.fst i{width:4px;height:16px;border-radius:2px;display:inline-block;flex:none}
.tag{display:inline-block;font-size:10.5px;font-weight:900;padding:1px 7px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag.real{background:var(--blue);color:#fff;border-color:var(--blue)}
table.issues .tag{font-size:11px;font-weight:400;padding:0 7px;border-radius:9px;background:var(--sd-pill-bg);color:var(--sd-pill-ink);border:1px solid var(--sd-pill-border);line-height:1.7}
table.issues .tag.real{background:var(--sd-sel);color:var(--sd-primary);border-color:var(--sd-accent);font-weight:700}
.pill{display:inline-block;font-size:11px;font-weight:900;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.open{background:var(--st-open-bg);color:var(--st-open)}
.pill.pending{background:var(--st-pend-bg);color:var(--st-pend)}
.pill.review{background:var(--st-rev-bg);color:var(--st-rev)}
.pill.closed{background:var(--st-closed-bg);color:var(--st-closed)}
.tl-meta .c-num{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.badges{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.badge{font-size:11px;padding:0 7px;border-radius:9px;background:var(--sd-pill-bg);border:1px solid var(--sd-pill-border);color:var(--sd-pill-ink);white-space:nowrap;line-height:1.7}
.badge.reopen{color:#a02c2c;border-color:#e3b7b7;background:#fdf1f1}

/* ミニ履歴グラフ */
.mini-track{display:flex;align-items:center;min-width:120px}
.mini-node{display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mini-node .dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:900;border:2px solid var(--sd-pill-border);background:var(--surface);color:var(--sd-sub)}
.mini-node.start .dot{background:var(--ink);color:var(--surface);border-color:var(--ink);font-size:7px}
.mini-node.goal .dot{border-radius:6px;font-size:11px;border-color:#4caf7d;color:#4caf7d}
.mini-node.reopen .dot{background:#fdf1f1;border-color:#a02c2c;color:#a02c2c;font-size:11px}
.mini-node.model .dot{font-variant-numeric:tabular-nums;background:var(--sd-pill-bg);color:var(--sd-pill-ink);border-color:var(--sd-pill-border)}
.mini-node.status .dot{border-radius:4px;background:#fdf3e3;border-color:#d97706;color:#d97706;font-size:9px}
.mini-node.pending .dot{background:#fdf3e3;border-color:#d97706;color:#d97706;font-size:7.5px}
.mini-node.review .dot{background:var(--sd-sel);border-color:#3b82c4;color:#3b82c4;font-size:11px;animation:blink 1.6s ease-in-out infinite}
.mini-node.now .dot{border-color:var(--sd-accent);background:var(--surface);position:relative}
.mini-node.now .dot:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--sd-accent);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){ .mini-node.review .dot,.mini-node.now .dot:after{animation:none} }
.mini-line{flex:1;height:2px;background:var(--sd-accent);min-width:8px;margin:0 2px;opacity:.45}
.mini-line.open-end{background:repeating-linear-gradient(90deg,var(--sd-accent) 0 4px,transparent 4px 8px)}

/* ---------- 差分ビュー ---------- */
.diff-counts{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.dc{font-size:11.5px;font-weight:900;padding:2px 9px;border-radius:999px;white-space:nowrap}
.dc.a{background:var(--add-bg);color:var(--add)}
.dc.d{background:var(--del-bg);color:var(--del)}
.dc.c{background:var(--chg-bg);color:var(--chg)}
.diff-body{padding:14px}
.diff-flex{display:flex;gap:16px;flex-wrap:wrap}
.plan-box{border:1px solid var(--line);border-radius:6px;overflow:hidden;width:400px;max-width:100%;flex-shrink:0}
.plan-box header{display:flex;justify-content:space-between;gap:8px;padding:7px 12px;background:var(--surface2);font-size:12px;font-weight:900}
.plan-box header span:last-child{font-family:"IBM Plex Mono",monospace}
.plan-box header b{color:var(--blue-dark)}
.plan-box svg{display:block;width:100%;height:auto;background:#fbfcfb}
.diff-side{flex:1;min-width:220px;font-size:12.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .la{background:var(--add-bg);border:1.5px solid var(--add)}
.legend .ld{background:var(--del-bg);border:1.5px dashed var(--del)}
.legend .lc{background:var(--chg-bg);border:1.5px solid var(--chg)}
.diff-near{font-weight:700;font-size:13px}
.diff-side ul{margin:6px 0 0 18px;line-height:1.6;color:var(--muted);font-size:12px}
.diff-note{margin-top:8px;font-size:11.5px;color:var(--muted)}
.diff-empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- 右カラム：タイムライン ---------- */
.tl-panel{position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column}
@media(max-width:960px){.tl-panel{position:static;max-height:none}}
.tl-head{padding:13px 16px 11px;border-bottom:1px solid var(--line)}
.tl-head .kicker{font-size:11px;font-weight:900;color:var(--blue-dark);letter-spacing:.06em}
.tl-head h2{font-size:16px;line-height:1.45;margin-top:3px}
.tl-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.tl-scroll{overflow-y:auto;padding:6px 16px 16px}
.timeline{position:relative;margin:10px 0 0 6px;padding-left:26px}
.timeline:before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:2px;background:var(--line)}
.ev{position:relative;padding:7px 0}
.ev-dot{position:absolute;left:-26px;top:11px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--muted);z-index:1}
.ev.open .ev-dot{background:var(--ink);border-color:var(--ink)}
.ev.goal .ev-dot{width:18px;height:18px;left:-28px;top:9px;border-radius:5px;background:var(--gold-bg);border-color:var(--gold)}
.ev.reopen .ev-dot{background:var(--red-bg);border-color:var(--red)}
.ev.model .ev-dot{background:var(--blue);border-color:var(--blue)}
.ev.status .ev-dot{border-radius:4px;background:var(--st-rev-bg);border-color:var(--st-rev)}
.ev.now .ev-dot{border-color:var(--blue)}
.ev.now .ev-dot:after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--blue);animation:blink 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){ .ev.now .ev-dot:after{animation:none} }
.ev-row{width:100%;background:none;border:none;padding:2px 4px;border-radius:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;font-size:13px;line-height:1.55;color:var(--ink)}
button.ev-row:hover{background:var(--surface2)}
.ev.model.selected .ev-row{background:var(--blue-soft)}
.ev-when{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.ev-text{flex:1;min-width:170px}
.ev-text b{font-weight:700}
.ev.model .ev-text{font-weight:700}
.ev .st-arrow{font-weight:900}
footer{margin-top:16px;font-size:11.5px;color:var(--muted);text-align:center}

@media(max-width:720px){
  .c-tag,.c-due{display:none}
  table.issues{min-width:0}
  .c-title{min-width:0}
}
</style>
</head>
<body>

<div class="shell">
  <div class="page-head">
    <h1>Issues — 履歴グラフ</h1>
    <p>Open がスタート、Close がゴール。Reopen で同じグラフが続きます。行を選ぶと右にタイムライン、下に差分ビューが出ます。</p>
  </div>

  <div class="app-grid">
    <div class="left-col">
      <section class="panel issues-panel" aria-label="Issue一覧">
        <div class="panel-head">
          <h2>Issue 一覧</h2>
          <span class="ph-note" id="tblCount"></span>
          <div class="chips" id="chips" role="group" aria-label="ステータスで絞り込み"></div>
        </div>
        <div class="tbl-toolbar">
          <input type="text" id="fltQ" placeholder="Title, ID, or description" aria-label="タイトル、ID、担当などで検索">
        </div>
        <div class="tbl-wrap">
          <table class="issues">
            <thead id="issueHead"></thead>
            <tbody id="issueRows"></tbody>
          </table>
        </div>
        <div class="pager">
          <button id="btnPrev" type="button">前へ</button>
          <span id="pagerInfo">—</span>
          <button id="btnNext" type="button">次へ</button>
          <span style="flex:1"></span>
          <label>表示件数
            <select id="pageSize">
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>
        </div>
      </section>

      <section class="panel" aria-label="差分ビュー">
        <div class="panel-head">
          <h2 id="diffTitle">差分ビュー</h2>
          <div class="diff-counts" id="diffCounts"></div>
        </div>
        <div id="diffBody"></div>
      </section>
    </div>

    <aside class="panel tl-panel" aria-label="タイムライン">
      <div class="tl-head">
        <p class="kicker">タイムライン</p>
        <h2 id="tlTitle"></h2>
        <div class="tl-meta" id="tlMeta"></div>
      </div>
      <div class="tl-scroll"><div class="timeline" id="tlBody"></div></div>
    </aside>
  </div>

  <footer>UI モックです。ISS-301〜305 は実モデル「Snowdon Towers Sample Architectural」の実変更に基づきます。</footer>
</div>

<script>
/* ================= 平面図（差分ビュー用：1枚に新旧を重ねて色分け） ================= */
var SLOT = [[52,58],[150,58],[248,58]];
function planFrame(room){
  return '<rect x="18" y="14" width="304" height="172" fill="none" stroke="#5b6b60" stroke-width="2.5"/>'
    + '<text x="34" y="36" font-size="12" font-weight="700" fill="#18211c">'+room+'</text>';
}
function pin(x,y){ return '<circle cx="'+x+'" cy="'+y+'" r="6" fill="#b91c1c" stroke="#fff" stroke-width="2"/>'; }

function deskDiffSVG(p){
  var s = '<svg viewBox="0 0 340 200" role="img" aria-label="差分平面図">' + planFrame(p.room);
  for(var i=0;i<3;i++){
    var q = SLOT[i], cx = q[0]+36;
    if(p.moved === i){
      s += '<rect x="'+q[0]+'" y="'+q[1]+'" width="72" height="40" rx="4" fill="#fff3bf" stroke="#b8860b" stroke-width="2.5"/>';
      s += '<text x="'+cx+'" y="'+(q[1]+19)+'" font-size="11" font-weight="700" text-anchor="middle" fill="#18211c">机 '+(i+1)+'</text>';
      s += '<text x="'+cx+'" y="'+(q[1]+33)+'" font-size="8.5" font-weight="700" text-anchor="middle" fill="#b8860b">配置変更</text>';
    } else if(i < p.desks && i < p.before){
      s += '<rect x="'+q[0]+'" y="'+q[1]+'" width="72" height="40" rx="4" fill="#e8ece8" stroke="#5b6b60" stroke-width="2"/>';
      s += '<text x="'+cx+'" y="'+(q[1]+24)+'" font-size="11" font-weight="700" text-anchor="middle" fill="#18211c">机 '+(i+1)+'</text>';
    } else if(i < p.desks && i >= p.before){
      s += '<rect x="'+q[0]+'" y="'+q[1]+'" width="72" height="40" rx="4" fill="#d9f2e3" stroke="#1e9e57" stroke-width="2.5"/>';
      s += '<text x="'+cx+'" y="'+(q[1]+19)+'" font-size="11" font-weight="700" text-anchor="middle" fill="#14532d">机 '+(i+1)+'</text>';
      s += '<text x="'+cx+'" y="'+(q[1]+33)+'" font-size="8.5" font-weight="700" text-anchor="middle" fill="#1e9e57">追加</text>';
    } else if(i >= p.desks && i < p.before){
      s += '<rect x="'+q[0]+'" y="'+q[1]+'" width="72" height="40" rx="4" fill="#fde3e1" stroke="#d43a2f" stroke-width="2" stroke-dasharray="5 4"/>';
      s += '<text x="'+cx+'" y="'+(q[1]+19)+'" font-size="11" font-weight="700" text-anchor="middle" fill="#7f1d1d">机 '+(i+1)+'</text>';
      s += '<text x="'+cx+'" y="'+(q[1]+33)+'" font-size="8.5" font-weight="700" text-anchor="middle" fill="#d43a2f">削除</text>';
    } else {
      s += '<rect x="'+q[0]+'" y="'+q[1]+'" width="72" height="40" rx="4" fill="none" stroke="#c3ccc5" stroke-width="1.5" stroke-dasharray="5 4"/>';
      s += '<text x="'+cx+'" y="'+(q[1]+24)+'" font-size="9" text-anchor="middle" fill="#a7b3aa">空き</text>';
    }
  }
  return s + pin(170,140) + '</svg>';
}

function roomDiffSVG(){
  var s = '<svg viewBox="0 0 340 200" role="img" aria-label="差分平面図">' + planFrame('3F 会議室');
  s += '<line x1="202" y1="14" x2="202" y2="186" stroke="#d43a2f" stroke-width="2" stroke-dasharray="6 4"/>';
  s += '<text x="196" y="176" font-size="9" font-weight="700" text-anchor="end" fill="#d43a2f">旧・壁位置</text>';
  s += '<line x1="262" y1="14" x2="262" y2="186" stroke="#b8860b" stroke-width="4"/>';
  s += '<text x="268" y="36" font-size="11" fill="#66706a">廊下</text>';
  s += '<text x="34" y="56" font-size="11" fill="#66706a">面積 28.4㎡ → 34.8㎡</text>';

var STATUS_CLS = {"Open":"open","Pending":"pending","In Review":"review","Closed":"closed"};
var TODAY = "2026-11-17";
var currentIssue = 6; /* ISS-207（器具の作り替え） */
var selectedVer = null;
var filter = "all";

function countEvents(iss, type){ return iss.events.filter(function(e){ return e.type===type; }).length; }

function miniHTML(iss){
  return iss.mini.map(function(n, i){
    var label = n[0]==='goal' ? '🏁' : n[0]==='reopen' ? '↩' : n[0]==='start' ? '●' : n[0]==='review' ? '⚑' : n[1];
    var openEnd = (n[0]==='now' || n[0]==='pending') ? ' open-end' : '';
    var node = '<span class="mini-node '+n[0]+'"><span class="dot">'+label+'</span></span>';
    var line = i < iss.mini.length-1 ? '<span class="mini-line'+openEnd+'"></span>' : '';
    return node + line;
  }).join('');
}

function renderChips(){
  var defs = [["all","すべて"],["Open","Open"],["Pending","Pending"],["In Review","In Review"],["Closed","Closed"]];
  document.getElementById('chips').innerHTML = defs.map(function(d){
    var n = d[0]==='all' ? ISSUES.length : ISSUES.filter(function(x){ return x.status===d[0]; }).length;
    return '<button type="button" class="chip'+(filter===d[0]?' active':'')+'" data-f="'+d[0]+'">'+d[1]+' <span class="n">'+n+'</span></button>';
  }).join('');
  document.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click', function(){ filter = c.getAttribute('data-f'); page = 1; renderChips(); renderTable(); });
  });
}

/* ---------- 表機能（sample-d と同じ：検索・ヘッダーソート・ページネーション） ---------- */
var STATUS_BAR = {"Open":"#e8a33d","Pending":"#d97706","In Review":"#3b82c4","Closed":"#4caf7d"};
var STATUS_LABEL = {"Open":"Open","Pending":"Pending","In Review":"In review","Closed":"Closed"};
var page = 1, pageSize = 5, sortState = null, query = "";
var COLS = [
  {key:"num", label:"#", sortable:true},
  {key:"title", label:"タイトル", sortable:true},
  {key:"status", label:"ステータス", sortable:true},
  {key:"assignee", label:"担当", sortable:true},
  {key:"due", label:"期限", sortable:true, cls:"c-due"},
  {key:"tag", label:"パターン", sortable:true, cls:"c-tag"},
  {key:"mini", label:"履歴グラフ", sortable:false}
];
var SORT_GET = {
  num: function(i){ return parseInt(i.id.replace(/\D/g,''),10); },
  title: function(i){ return i.title; },
  status: function(i){ return STATUS_LABEL[i.status] || i.status; },
  assignee: function(i){ return i.assignee; },
  due: function(i){ return i.due; },
  tag: function(i){ return i.tag || ''; }
};
function visibleIssues(){
  var q = query.trim().toLowerCase();
  var list = ISSUES.map(function(iss, idx){ return {iss:iss, idx:idx}; }).filter(function(o){
    if(filter!=='all' && o.iss.status!==filter) return false;
    if(q){
      var hay = (o.iss.id+' '+o.iss.title+' '+o.iss.assignee+' '+(o.iss.tag||'')).toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  });
  if(sortState){
    var get = SORT_GET[sortState.key], dir = sortState.dir;
    list.sort(function(a, b){
      var va = get(a.iss), vb = get(b.iss);
      var ea = (va==='' || va==null), eb = (vb==='' || vb==null);
      if(ea || eb) return ea===eb ? 0 : (ea ? 1 : -1);
      var c = (typeof va==='number' && typeof vb==='number') ? va-vb : String(va).localeCompare(String(vb),'ja',{numeric:true});
      return c*dir;
    });
  }
  return list;
}
function renderHead(){
  document.getElementById('issueHead').innerHTML = '<tr>' + COLS.map(function(c){
    var cls = c.cls || '';
    if(!c.sortable) return '<th scope="col"'+(cls?' class="'+cls+'"':'')+'>'+c.label+'</th>';
    var active = sortState && sortState.key===c.key;
    var arrow = active ? ' <span class="arr">'+(sortState.dir===1?'▲':'▼')+'</span>' : '';
    return '<th scope="col" class="sortable'+(active?' sorted':'')+(cls?' '+cls:'')+'" data-key="'+c.key+'" title="クリックでソート（昇順→降順→解除）">'+c.label+arrow+'</th>';
  }).join('') + '</tr>';
  document.querySelectorAll('#issueHead th.sortable').forEach(function(th){
    th.addEventListener('click', function(){
      var key = th.getAttribute('data-key');
      if(!sortState || sortState.key!==key) sortState = {key:key, dir:1};
      else if(sortState.dir===1) sortState = {key:key, dir:-1};
      else sortState = null;
      page = 1;
      renderTable();
    });
  });
}
function renderTable(){
  renderHead();
  var list = visibleIssues();
  var pages = Math.max(1, Math.ceil(list.length / pageSize));
  if(page > pages) page = pages;
  if(page < 1) page = 1;
  var slice = list.slice((page-1)*pageSize, page*pageSize);
  var html;
  if(!slice.length){
    html = '<tr><td colspan="7" style="color:var(--sd-sub)">条件に合う Issue はありません。</td></tr>';
  } else {
    html = slice.map(function(o){
      var iss = o.iss, idx = o.idx;
      var closes = countEvents(iss,'goal'), reopens = countEvents(iss,'reopen');
      var badges = '';
      if(closes>0 || reopens>0){
        badges = '<div class="badges">'
          + (closes>0 ? '<span class="badge">Close ×'+closes+'</span>' : '')
          + (reopens>0 ? '<span class="badge reopen">Reopen ×'+reopens+'</span>' : '')
          + '</div>';
      }
      var overdue = iss.status!=='Closed' && iss.due < TODAY;
      return '<tr data-idx="'+idx+'" class="'+(idx===currentIssue?'active':'')+'" tabindex="0" aria-label="'+iss.id+' '+iss.title+'">'
        + '<td class="c-num">'+iss.id.replace('ISS-','#')+'</td>'
        + '<td class="c-title">'+iss.title+'</td>'
        + '<td><span class="fst"><i style="background:'+STATUS_BAR[iss.status]+'"></i>'+STATUS_LABEL[iss.status]+'</span>'+badges+'</td>'
        + '<td class="c-assignee">'+iss.assignee+'</td>'
        + '<td class="c-due'+(overdue?' overdue':'')+'">'+iss.due+(overdue?'<span class="od">期限超過</span>':'')+'</td>'
        + '<td class="c-tag">'+(iss.tag?'<span class="tag'+(iss.tag==='実データ'?' real':'')+'">'+iss.tag+'</span>':'')+'</td>'
        + '<td><div class="mini-track">'+miniHTML(iss)+'</div></td>'
        + '</tr>';
    }).join('');
  }
  document.getElementById('issueRows').innerHTML = html;
  document.getElementById('tblCount').textContent = list.length + ' 件表示 / 全 ' + ISSUES.length + ' 件';
  document.getElementById('pagerInfo').textContent = page + ' / ' + pages + ' ページ（全 ' + list.length + ' 件）';
  document.getElementById('btnPrev').disabled = page <= 1;
  document.getElementById('btnNext').disabled = page >= pages;
  document.querySelectorAll('#issueRows tr[data-idx]').forEach(function(r){
    var go = function(){ selectIssue(parseInt(r.getAttribute('data-idx'),10)); };
    r.addEventListener('click', go);
    r.addEventListener('keydown', function(e){ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); go(); } });
  });
}

function showDiff(plan){
  selectedVer = plan ? plan.ver : null;
  var title = document.getElementById('diffTitle');
  var counts = document.getElementById('diffCounts');
  var body = document.getElementById('diffBody');
  if(!plan){
    title.textContent = '差分ビュー';
    counts.innerHTML = '';
    body.innerHTML = '<p class="diff-empty">この Issue には、まだモデル更新がありません。<br>タイムラインにモデル更新が入ると、ここにバージョン間の差分が出ます。</p>';
  } else {
    title.textContent = '差分ビュー ' + prevVer(plan.ver) + ' → ' + plan.ver;
    counts.innerHTML = '<span class="dc a">追加 '+plan.counts.a+'</span><span class="dc d">削除 '+plan.counts.d+'</span><span class="dc c">変更 '+plan.counts.c+'</span>';
    body.innerHTML = '<div class="diff-body"><div class="diff-flex">'
      + '<div class="plan-box"><header><span>モデル '+plan.ver+' 時点</span><span>'+planHeadRight(plan)+'</span></header>' + diffSVG(plan) + '</div>'
      + '<div class="diff-side">'
      + '<div class="legend"><span><i class="la"></i>追加</span><span><i class="ld"></i>削除</span><span><i class="lc"></i>変更</span><span>灰色＝変化なし</span></div>'
      + '<p class="diff-near">このIssueの周辺：'+plan.diff.near+'</p>'
      + '<ul>' + plan.diff.items.map(function(it){ return '<li>'+it+'</li>'; }).join('') + '</ul>'
      + (plan.diff.note ? '<p class="diff-note">'+plan.diff.note+'</p>' : '')
      + '</div></div></div>';
  }
  document.querySelectorAll('.ev.model').forEach(function(el){
    el.classList.toggle('selected', !!plan && el.getAttribute('data-ver')===plan.ver);
  });
}

function selectIssue(idx){
  currentIssue = idx;
  var iss = ISSUES[idx];
  renderTable();
  document.getElementById('tlTitle').textContent = iss.title;
  document.getElementById('tlMeta').innerHTML =
    '<span class="c-num">'+iss.id+'</span>'
    + '<span class="pill '+STATUS_CLS[iss.status]+'">'+iss.status+'</span>'
    + '<span>担当：'+iss.assignee+'</span>'
    + '<span>期限：'+iss.due+'</span>'
    + (iss.tag ? '<span class="tag'+(iss.tag==='実データ'?' real':'')+'">'+iss.tag+'</span>' : '');
  document.getElementById('tlBody').innerHTML = iss.events.map(function(ev){
    var inner = '<span class="ev-when">'+ev.when+'</span><span class="ev-text">'+ev.text+'</span>';
    if(ev.plan){
      return '<div class="ev '+ev.type+'" data-ver="'+ev.plan.ver+'"><span class="ev-dot"></span><button class="ev-row" type="button">'+inner+'</button></div>';
    }
    return '<div class="ev '+ev.type+'"><span class="ev-dot"></span><div class="ev-row">'+inner+'</div></div>';
  }).join('');
  document.querySelectorAll('.ev.model .ev-row').forEach(function(btn){
    btn.addEventListener('click', function(){
      var ver = btn.closest('.ev').getAttribute('data-ver');
      var found = null;
      iss.events.forEach(function(e){ if(e.plan && e.plan.ver===ver) found = e.plan; });
      showDiff(found);
    });
  });
  var lastPlan = null;
  iss.events.forEach(function(e){ if(e.plan) lastPlan = e.plan; });
  showDiff(lastPlan);
}

document.getElementById('fltQ').addEventListener('input', function(){ query = this.value; page = 1; renderTable(); });
document.getElementById('pageSize').addEventListener('change', function(){ pageSize = parseInt(this.value,10); page = 1; renderTable(); });
document.getElementById('btnPrev').addEventListener('click', function(){ if(page>1){ page--; renderTable(); } });
document.getElementById('btnNext').addEventListener('click', function(){ page++; renderTable(); });
page = Math.floor(currentIssue / pageSize) + 1;
renderChips();
renderTable();
selectIssue(currentIssue);
</script>
</body>
</html>
